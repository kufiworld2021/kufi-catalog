<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKU110 كتالوج التركيب</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --brown:#53250E;
    --brown-light:#8a5a35;
    --beige:#F9E7D2;
    --cream:#fbf3e9;
    --line:#e9d7bd;
    --text:#2b2018;
    --muted:#8a7a68;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Kufi Arabic', sans-serif;
    background:var(--cream);
    color:var(--text);
    direction:rtl;
  }
  header{
    background:var(--brown);
    padding:16px 16px 22px;
    text-align:center;
    color:var(--beige);
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
  }
  header .top-row{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
  }
  header img.logo{
    position:absolute;
    inset-inline-end:0;
    top:0;
    height:78px;
    width:auto;
  }
  header h1{
    margin:0;
    font-size:18px;
    font-weight:900;
    letter-spacing:.5px;
  }
  .lang-switch{
    display:flex;
    justify-content:center;
    gap:8px;
  }
  .lang-switch button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    padding:9px 22px;
    border-radius:24px;
    border:1.5px solid var(--beige);
    background:transparent;
    color:var(--beige);
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .lang-switch button.active{
    background:var(--beige);
    color:var(--brown);
  }
  .lang-switch button:hover:not(.active){
    background:rgba(249,231,210,.15);
  }
  .pages{
    max-width:900px;
    margin:0 auto;
    padding:20px 12px 60px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .pages img{
    width:100%;
    height:auto;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    box-shadow:0 2px 10px rgba(83,37,14,.06);
  }
  .lang-block{
    display:none;
    flex-direction:column;
    gap:14px;
  }
  .lang-block.active{
    display:flex;
  }
  footer{
    text-align:center;
    padding:22px;
    color:var(--muted);
    font-size:12px;
  }
</style>

<header>
  <div class="top-row">
    <img class="logo" src="logo-beige.png" alt="عالم الكوفي">
    <h1>SKU110 — كتالوج التركيب</h1>
  </div>
  <div class="lang-switch">
    <button type="button" class="active" data-lang="ar">العربية</button>
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="ur">اردو</button>
    <button type="button" data-lang="bn">বাংলা</button>
  </div>
</header>

<div class="pages">

  <div class="lang-block active" id="block-ar">
    <img src="ar/page-01.jpg" loading="lazy">
    <img src="ar/page-02.jpg" loading="lazy">
    <img src="ar/page-03.jpg" loading="lazy">
    <img src="ar/page-04.jpg" loading="lazy">
    <img src="ar/page-05.jpg" loading="lazy">
    <img src="ar/page-06.jpg" loading="lazy">
    <img src="ar/page-07.jpg" loading="lazy">
    <img src="ar/page-08.jpg" loading="lazy">
    <img src="ar/page-09.jpg" loading="lazy">
    <img src="ar/page-10.jpg" loading="lazy">
  </div>

  <div class="lang-block" id="block-en">
    <img src="en/page-01.jpg" loading="lazy">
    <img src="en/page-02.jpg" loading="lazy">
    <img src="en/page-03.jpg" loading="lazy">
    <img src="en/page-04.jpg" loading="lazy">
    <img src="en/page-05.jpg" loading="lazy">
    <img src="en/page-06.jpg" loading="lazy">
    <img src="en/page-07.jpg" loading="lazy">
    <img src="en/page-08.jpg" loading="lazy">
    <img src="en/page-09.jpg" loading="lazy">
    <img src="en/page-10.jpg" loading="lazy">
  </div>

  <div class="lang-block" id="block-ur">
    <img src="ur/page-01.jpg" loading="lazy">
    <img src="ur/page-02.jpg" loading="lazy">
    <img src="ur/page-03.jpg" loading="lazy">
    <img src="ur/page-04.jpg" loading="lazy">
    <img src="ur/page-05.jpg" loading="lazy">
    <img src="ur/page-06.jpg" loading="lazy">
    <img src="ur/page-07.jpg" loading="lazy">
    <img src="ur/page-08.jpg" loading="lazy">
    <img src="ur/page-09.jpg" loading="lazy">
    <img src="ur/page-10.jpg" loading="lazy">
  </div>

  <div class="lang-block" id="block-bn">
    <img src="bn/page-01.jpg" loading="lazy">
    <img src="bn/page-02.jpg" loading="lazy">
    <img src="bn/page-03.jpg" loading="lazy">
    <img src="bn/page-04.jpg" loading="lazy">
    <img src="bn/page-05.jpg" loading="lazy">
    <img src="bn/page-06.jpg" loading="lazy">
    <img src="bn/page-07.jpg" loading="lazy">
    <img src="bn/page-08.jpg" loading="lazy">
    <img src="bn/page-09.jpg" loading="lazy">
    <img src="bn/page-10.jpg" loading="lazy">
  </div>

</div>

<footer>© 2026 عالم الكوفي - جميع الحقوق محفوظة</footer>

<script>
  const btns = document.querySelectorAll('.lang-switch button');
  const blocks = document.querySelectorAll('.lang-block');
  btns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btns.forEach(b=>b.classList.remove('active'));
      blocks.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('block-'+btn.dataset.lang).classList.add('active');
    });
  });
</script>

</body>
</html>
